AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  Retention:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: staging-merchant-onboarding-asset-retention
      Runtime: nodejs22.x
      Handler: asset_retention.handler
      CodeUri: ../functions/auth/
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables: {ENVIRONMENT: staging}
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-MerchantPlatform
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-PlatformStaff
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: ['OPERATIONAL_SETTINGS#MERCHANT_ONBOARDING']
            - Effect: Allow
              Action: [dynamodb:ConditionCheckItem]
              Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-AccountDeletion
            - Effect: Allow
              Action: [s3:ListBucketVersions]
              Resource: arn:aws:s3:::staging-merchant-onboarding-699561669180
              Condition:
                StringLike: {s3:prefix: ['persons/*']}
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource: arn:aws:s3:::staging-merchant-onboarding-699561669180/persons/*
      Events:
        Daily:
          Type: Schedule
          Properties: {Schedule: 'rate(1 day)', Enabled: true}
  RetentionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/staging-merchant-onboarding-asset-retention
      RetentionInDays: 30
