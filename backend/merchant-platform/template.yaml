AWSTemplateFormatVersion: '2010-09-09'
Description: Staging merchant identities, organizations, memberships and drafts. Personal profiles and private drafts; operational branches remain in legacy storage.
Resources:
  OnboardingAssets:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: staging-merchant-onboarding-699561669180
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  MerchantPlatformTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: staging-MerchantPlatform
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: subjectPk, AttributeType: S}
        - {AttributeName: subjectSk, AttributeType: S}
        - {AttributeName: organizationPk, AttributeType: S}
        - {AttributeName: organizationSk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: SubjectIndex
          KeySchema:
            - {AttributeName: subjectPk, KeyType: HASH}
            - {AttributeName: subjectSk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
        - IndexName: OrganizationIndex
          KeySchema:
            - {AttributeName: organizationPk, KeyType: HASH}
            - {AttributeName: organizationSk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
Outputs:
  TableName:
    Value: !Ref MerchantPlatformTable
