  UnifiedAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'order-receiver-regional-${Stage}-unified-auth-v4-sam'
      Environment:
        Variables:
          SETTLEMENT_SCHEDULE_ADMIN_ENABLED: 'true'
          COMMERCIAL_ADMIN_ENABLED: !Ref CommercialAdminEnabled
          FINANCIAL_COD_RETURNS_MODE: !If [IsFinancialReturnStaging, 'REQUIRED', 'OFF']
          FINANCIAL_COD_ASSIGNMENTS_MODE: !If [IsFinancialReturnStaging, 'REQUIRED', 'OFF']
          FINANCIAL_ACCEPT_FUNCTION_ARN: 'arn:aws:lambda:us-east-1:699561669180:function:staging-driver-financial-accept'
          PROFILE_OTP_KEY_PARAM: !Sub '/whizz/${Stage}/otpiq-key'
          PROFILE_OTP_PROVIDER: whatsapp-telegram-sms
          PROFILE_OTP_SENDER: ''
      CodeUri: functions/auth/
      Handler: unified_auth_handler.handler
      Policies:
        - Statement:
          - Effect: Allow
            Action: [dynamodb:Query]
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_RegionIndex_staging/index/h3-index"
        - !If
          - IsFinancialReturnStaging
          - Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: 'arn:aws:lambda:us-east-1:699561669180:function:staging-driver-financial-accept'
          - !Ref AWS::NoValue

        - !If
          - IsFinancialReturnStaging
          - Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: 'arn:aws:lambda:us-east-1:699561669180:function:staging-wizz-staff-service'
          - !Ref AWS::NoValue

        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Discounts"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff"
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: ["OPERATIONAL_SETTINGS#MERCHANT_STAFF_PERMISSIONS"]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_PushDeviceTokens_staging"
              Condition:
                'ForAllValues:StringLike':
                  'dynamodb:LeadingKeys': ['BRANCH_DEVICE#*']
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/whizz/${Stage}/otpiq-key'
            - Effect: Allow
              Action: [cognito-idp:AdminUpdateUserAttributes]
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${MerchantsPhonePool}'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Users"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Users/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketConnectionsTableName}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketSubscriptionsTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebSocketSubscriptionsTableName}/index/*"
            - Effect: Allow
              Action: [dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:ConditionCheckItem]
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_Regions"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_RegionsDerived_staging"
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion"
              Condition:
                ForAllValues:StringLike:
