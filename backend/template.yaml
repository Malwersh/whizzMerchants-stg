AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wizz Merchants API - Complete Backend Stack v3.0

Parameters:
  CommercialAdminEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  MerchantStaffPermissionMode:
    Type: String
    Default: CENTRAL
    AllowedValues: [CENTRAL]
    Description: Staging cutover completed; rollback must retain central policy enforcement
  Stage:
    Type: String
    Default: staging
    Description: Deployment stage
  CentralPushApiBaseUrl:
    Type: String
    Default: "https://x066k4dftk.execute-api.us-east-1.amazonaws.com/staging"
    Description: Base URL for Central Notifications push API
  CentralNotificationsInternalKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Internal key for Central Notifications (sent as x-internal-key)
  WebSocketConnectionsTableName:
    Type: String
    Default: "WizzUser_websocket_connections_staging"
    Description: DynamoDB table name for shared WebSocket connections
  WebSocketSubscriptionsTableName:
    Type: String
    Default: "WizzUser_websocket_subscriptions_staging"
    Description: DynamoDB table name for shared WebSocket subscriptions
  BusinessPhotosBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for business photos (optional; if empty, the stack will create one)
  WizzUserApiBaseUrl:
    Type: String
    Default: ""
    Description: Base URL for WizzUser API (e.g. https://<api>.execute-api.<region>.amazonaws.com/staging)
  UserAppWebSocketUrl:
    Type: String
    Default: ""
    Description: WSS endpoint for User app WebSocket API
  BusinessAppWebSocketUrl:
    Type: String
    Default: ""
    Description: WSS endpoint for Business app WebSocket API
  UserWebSocketSendFunctionName:
    Type: String
    Default: ""
    Description: Lambda function name used to send updates to User app WebSocket
  BusinessWebSocketSendFunctionName:
    Type: String
    Default: ""
    Description: Lambda function name used to send updates to Business app WebSocket
  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID
  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito App Client ID
  CacheVersion:
    Type: String
    Default: "v3"
    Description: Cache busting version
  SharedWebSocketApiId:
    Type: String
    Default: ""
    Description: Shared WebSocket API ID (WizzUser-WebSocket-dev)
  SharedWebSocketUrl:
    Type: String  
    Default: ""
    Description: Shared WebSocket URL for ecosystem integration

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        MERCHANT_STAFF_PERMISSION_MODE: !Ref MerchantStaffPermissionMode
        ENVIRONMENT: !Ref Stage
        USERS_TABLE: WhizzMerchants_Users
        BUSINESSES_TABLE: WhizzMerchants_Businesses
        PRODUCTS_TABLE: WhizzMerchants_Products
        CATEGORIES_TABLE: WhizzMerchants_Categories
        BUSINESS_SUBCATEGORIES_TABLE: WhizzMerchants_BusinessSubcategories
        DISCOUNTS_TABLE: WhizzMerchants_Discounts
        BUSINESS_SETTINGS_TABLE: WhizzMerchants_BusinessSettings
        BUSINESS_WORKING_HOURS_TABLE: WhizzMerchants_BusinessWorkingHours
        POS_LOGS_TABLE: WhizzMerchants_PosLogs
        BUSINESS_PHOTOS_BUCKET: !If
          - CreateBusinessPhotosBucket
          - !Ref BusinessPhotosBucket
          - !Ref BusinessPhotosBucketName
        ORDERS_TABLE: WizzOrders
        WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTableName
        WEBSOCKET_SUBSCRIPTIONS_TABLE: !Ref WebSocketSubscriptionsTableName
        WEBSOCKET_ENDPOINT: !Ref SharedWebSocketUrl
        WIZZUSER_WEBSOCKET_ENDPOINT: !Ref SharedWebSocketUrl
        WIZZUSER_API_BASE_URL: !Ref WizzUserApiBaseUrl
        USER_WEBSOCKET_ENDPOINT: !Ref UserAppWebSocketUrl
        BUSINESS_WEBSOCKET_ENDPOINT: !Ref BusinessAppWebSocketUrl
        USER_WEBSOCKET_SEND_FUNCTION_NAME: !Ref UserWebSocketSendFunctionName
        BUSINESS_WEBSOCKET_SEND_FUNCTION_NAME: !Ref BusinessWebSocketSendFunctionName
        TIMEOUT_LOGS_TABLE: WhizzMerchants_TimeoutLogs
        # Merchants app has its own Cognito UserPool per stage.
        # NOTE: Parameters CognitoUserPoolId/CognitoClientId are kept for backward
        # compatibility but are no longer the source of truth.
        COGNITO_USER_POOL_ID: !Ref MerchantsPhonePool
        COGNITO_CLIENT_ID: !Ref MerchantsPhonePoolClient
        COGNITO_REGION: !Ref AWS::Region
        DYNAMODB_REGION: !Ref AWS::Region
        SNS_FCM_ARN: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:placeholder-fcm"
        SNS_APNS_ARN: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:placeholder-apns"
        # Central Notifications (shared push) base URL, e.g. https://x066k4dftk.execute-api.us-east-1.amazonaws.com/staging
        CENTRAL_PUSH_API_BASE_URL: !Ref CentralPushApiBaseUrl
        # Internal key to call Central Notifications internal send endpoints
        CENTRAL_NOTIFICATIONS_INTERNAL_KEY: !Ref CentralNotificationsInternalKey
        LAMBDA_CONFIG_VERSION: "2025-08-15T10:00:00Z"
    Tracing: Active

Conditions:
  IsFinancialReturnStaging: !Equals [!Ref Stage, staging]
  CreateBusinessPhotosBucket: !Equals [!Ref BusinessPhotosBucketName, ""]

Resources:
  # Phone-only, passwordless (OTP via OTPIQ). Changing UsernameAttributes replaces the pool;
  # the new name avoids a name clash with the old email-based pool during replacement.
  MerchantsPhonePool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "WhizzMerchants-phone-users-${Stage}"
      UsernameAttributes:
        - phone_number
      Schema:
        - Name: phone_number
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_phone_number
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt OtpPreSignUpFunction.Arn
        DefineAuthChallenge: !GetAtt OtpDefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt OtpCreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt OtpVerifyAuthChallengeFunction.Arn

  MerchantsPhonePoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "WhizzMerchants-app-client-${Stage}"
      UserPoolId: !Ref MerchantsPhonePool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # Merchant re-enters an OTP about once a year; access/ID tokens refresh silently.
      RefreshTokenValidity: 365
      AccessTokenValidity: 1
      IdTokenValidity: 1
      AuthSessionValidity: 3
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours
      ExplicitAuthFlows:
        - ALLOW_CUSTOM_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # OTP triggers are plain AWS::Lambda::Function (not Serverless) so SAM Globals
  # (which inject !Ref MerchantsPhonePool) don't create a circular dependency.
  OtpTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadOtpiqKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/whizz/${Stage}/otpiq-key"

  OtpPreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "WhizzMerchants-otp-presignup-${Stage}"
      Runtime: nodejs20.x
      Code: functions/auth-otp/
      Handler: pre_sign_up.handler
      Role: !GetAtt OtpTriggerRole.Arn
      Timeout: 5

  OtpDefineAuthChallengeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "WhizzMerchants-otp-define-${Stage}"
      Runtime: nodejs20.x
      Code: functions/auth-otp/
      Handler: define_auth_challenge.handler
      Role: !GetAtt OtpTriggerRole.Arn
      Timeout: 5

  OtpCreateAuthChallengeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "WhizzMerchants-otp-create-${Stage}"
      Runtime: nodejs20.x
      Code: functions/auth-otp/
      Handler: create_auth_challenge.handler
      Role: !GetAtt OtpTriggerRole.Arn
      Timeout: 10
      Environment:
        Variables:
          OTPIQ_KEY_PARAM: !Sub "/whizz/${Stage}/otpiq-key"
          OTPIQ_PROVIDER: whatsapp-telegram-sms
          OTPIQ_SENDER_ID: ""

  OtpVerifyAuthChallengeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "WhizzMerchants-otp-verify-${Stage}"
      Runtime: nodejs20.x
      Code: functions/auth-otp/
      Handler: verify_auth_challenge.handler
      Role: !GetAtt OtpTriggerRole.Arn
      Timeout: 5

  OtpPreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OtpPreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt MerchantsPhonePool.Arn

  OtpDefineAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OtpDefineAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt MerchantsPhonePool.Arn

  OtpCreateAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OtpCreateAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt MerchantsPhonePool.Arn

  OtpVerifyAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OtpVerifyAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt MerchantsPhonePool.Arn

  BusinessPhotosBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBusinessPhotosBucket
    Properties:
      # Business/product photos are displayed publicly in the customer app,
      # so objects must be world-readable (enforced via bucket policy below).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  BusinessPhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBusinessPhotosBucket
    Properties:
      Bucket: !Ref BusinessPhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadBusinessPhotos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${BusinessPhotosBucket.Arn}/*"

  # New Regional API to bypass CloudFront 403s
  RegionalRestApi:
    Type: AWS::Serverless::Api
    DependsOn: BusinessStatusBroadcastFunction
    Properties:
      Name: !Sub "order-receiver-regional-${Stage}"
      # Dedicated COD stack owns return/cancellation child routes. Preserve these and other separately managed paths.
      Mode: merge
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      DefinitionBody:
        'Fn::Sub': |
          openapi: 3.0.1
          info:
            title: Order Receiver API
            description: Regional API Gateway with AWS Lambda integrations (Fixed Cognito Auth)
            version: "1.0"
          components:
            securitySchemes:
              CognitoAuthorizer:
                type: apiKey
                name: Authorization
                in: header
                x-amazon-apigateway-authtype: cognito_user_pools
                x-amazon-apigateway-authorizer:
                  type: cognito_user_pools
                  providerARNs:
                    - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${MerchantsPhonePool}"
              MerchantBranchDevice:
                type: apiKey
                name: Authorization
                in: header
                x-amazon-apigateway-authtype: custom
                x-amazon-apigateway-authorizer:
                  type: token
                  authorizerUri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  authorizerResultTtlInSeconds: 0
          paths:
              /auth/branch-devices:
                get:
                  security:
                    - CognitoAuthorizer: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
                post:
                  security:
                    - CognitoAuthorizer: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
                options:
                  security: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
              /branch-device:
                post:
                  security:
                    - MerchantBranchDevice: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
                options:
                  security: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${UnifiedAuthFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
              /branch-device/merchant/orders/{businessId}:
                get:
                  security:
                    - MerchantBranchDevice: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${MerchantOrderFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
                options:
                  security: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${MerchantOrderFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
              /branch-device/merchant/order/{orderId}/confirm:
                put:
                  security:
                    - MerchantBranchDevice: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${MerchantOrderFunction.Arn}/invocations
                  responses:
                    '200':
                      description: Success
                options:
                  security: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${MerchantOrderFunction.Arn}/invocations
                  responses:
                    '200':
