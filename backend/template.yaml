        Variables:
          BROADCAST_FUNCTION_NAME: !Ref BusinessStatusBroadcastFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:ConditionCheckItem]
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_Regions'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_RegionsDerived_staging'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem]
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_BusinessWorkingHours'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Products'
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Products/index/BusinessIdIndex'

        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-websocket-connections-${Stage}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-websocket-connections-${Stage}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${MerchantsPhonePool}"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt BusinessStatusBroadcastFunction.Arn

  DiscountManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'order-receiver-regional-${Stage}-discount-management-v1-sam'
      CodeUri: functions/discounts/
      Handler: discount_management_handler.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Discounts"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Discounts/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses/index/*"
            - Sid: ReadAndFenceSharedDiscountApproval
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform"
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["CAMPAIGN_SHARING_LOCK#MERCHANT#*", "BRANCH#*"]
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
                - cognito-idp:AdminGetUser
              Resource: arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_gtCR3ndzT

  MerchantOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'order-receiver-merchant-orders-${Stage}-v1'
      CodeUri: functions/orders/
      Handler: merchant_order_handler.handler
      Environment:
        Variables:
          ORDERS_TABLE: WizzOrders
          MERCHANT_ENDPOINTS_TABLE: !Sub 'order-receiver-merchant-endpoints-${Stage}'
          DEVICE_TOKENS_TABLE: WhizzMerchants_DeviceTokens
          WEBSOCKET_ENDPOINT: !Ref SharedWebSocketUrl
          ORDER_EVENTS_TOPIC_ARN: !Ref OrderEventsTopic
          TIMEOUT_LOGS_TABLE: !Sub 'order-receiver-timeout-logs-${Stage}'
          BUSINESSES_TABLE: WhizzMerchants_Businesses
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform"
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["BRANCH#*"]
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-PlatformStaff"
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: ["OPERATIONAL_SETTINGS#MERCHANT_STAFF_PERMISSIONS"]
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-MerchantPlatform"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/staging-AccountDeletion"
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - arn:aws:dynamodb:*:*:table/WizzOrders
                - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-merchant-endpoints-${Stage}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-merchant-endpoints-${Stage}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_DeviceTokens"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_DeviceTokens/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-timeout-logs-${Stage}"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OrderEventsTopic
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedWebSocketApiId}/${Stage}/POST/@connections/*"

  OrderStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'order-receiver-stream-processor-${Stage}-v1'
      CodeUri: functions/streams/
      Handler: order_stream_handler.handler
      Environment:
        Variables:
          ORDERS_TABLE: WizzOrders
          MERCHANT_ENDPOINTS_TABLE: !Sub 'order-receiver-merchant-endpoints-${Stage}'
          CONNECTIONS_TABLE: !Sub 'WizzUser_websocket_connections_${Stage}'
          BUSINESSES_TABLE: WhizzMerchants_Businesses
          WEBSOCKET_ENDPOINT: !Ref SharedWebSocketUrl
          ORDER_EVENTS_TOPIC: !Ref OrderEventsTopic
          PUSH_NOTIFICATIONS_TOPIC: !Ref OrderEventsTopic
      # Events:
      #   OrdersTableStream:
      #     Type: DynamoDB
      #     Properties:
      #       Stream: arn:aws:dynamodb:us-east-1:031857856164:table/WizzOrders/stream/2025-09-26T15:46:10.194
      #       StartingPosition: TRIM_HORIZON
      #       BatchSize: 10
      #       MaximumBatchingWindowInSeconds: 5
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: arn:aws:dynamodb:us-east-1:031857856164:table/WizzOrders/stream/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 
                - arn:aws:dynamodb:*:*:table/WizzOrders
                - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource: 
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-merchant-endpoints-${Stage}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/order-receiver-merchant-endpoints-${Stage}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_websocket_connections_${Stage}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_websocket_connections_${Stage}/index/*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Businesses"
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedWebSocketApiId}/${Stage}/POST/@connections/*"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: 
                - !Ref OrderEventsTopic

