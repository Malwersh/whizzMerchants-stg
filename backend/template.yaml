                options:
                  security: []
                  x-amazon-apigateway-integration:
                    type: aws_proxy
                    httpMethod: POST
                    uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${MerchantOrderFunction.Arn}/invocations
                  responses:
