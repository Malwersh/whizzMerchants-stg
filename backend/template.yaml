  MerchantEndpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'order-receiver-merchant-endpoints-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: merchantId
          AttributeType: S
        - AttributeName: endpointType
          AttributeType: S
      KeySchema:
        - AttributeName: merchantId
          KeyType: HASH
        - AttributeName: endpointType
          KeyType: RANGE
      Tags:
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: OrderReceiver
        - Key: Purpose
          Value: merchant-endpoints

  TimeoutLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'order-receiver-timeout-logs-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: OrderReceiver
        - Key: Purpose
          Value: timeout-logs

