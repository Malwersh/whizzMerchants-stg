  # Register Device Token Function for Push Notifications
  RegisterDeviceTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'whizz-merchants-${Stage}-register-device-token'
      CodeUri: functions/notifications/
      Handler: register-device-token.handler
      Environment:
        Variables:
          DEVICE_TOKENS_TABLE: WhizzMerchants_DeviceTokens
      Events:
        RegisterDeviceToken:
          Type: Api
          Properties:
            RestApiId: !Ref RegionalRestApi
            Path: /merchants/{merchantId}/device-token
            Method: POST
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_DeviceTokens"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_DeviceTokens/index/*"

  # DynamoDB Tables
  # NOTE: WhizzMerchants_BusinessWorkingHours is managed outside this stack (already exists in staging).

  # Device Tokens Table for Push Notifications
  DeviceTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WhizzMerchants_DeviceTokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
        - AttributeName: merchantId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MerchantDeviceIndex
          KeySchema:
            - AttributeName: merchantId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: WhizzMerchants
        - Key: Purpose
          Value: push-notifications

  BranchDeviceAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UnifiedAuthFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RegionalRestApi}/authorizers/*'

