name: whizz_merchants
description: WhizzMerchant - Complete business management solution for restaurants, cafes, and retail stores

publish_to: 'none'

version: 1.0.0+346

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  fl_chart: ^1.1.0
  intl: ^0.20.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_riverpod: ^2.4.10
  provider: ^6.1.2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  http: ^1.1.2
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0
  amplify_api: ^2.0.0
  web_socket_channel: ^3.0.3
  audioplayers: ^6.5.1
  flutter_local_notifications: ^19.4.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  http_parser: ^4.0.2
  uuid: ^4.4.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  animations: ^2.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.5.0
  google_places_flutter: ^2.0.9
  flutter_dotenv: ^5.1.0
  jwt_decode: ^0.3.1
  jwt_decoder: ^2.0.1
  google_maps_flutter: ^2.18.1
  file_picker: ^11.0.3
  image: ^4.5.4
  archive: ^4.5.2
  xml: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/images/wizz-wordmark-blue.png
    - assets/images/wizz-company-primary.png
    - .env

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  # Base icon (square 1024x1024) with PRIMARY yellow background
  image_path: "assets/images/wizbusiness_wordmark_on_yellow_1024.png"
  min_sdk_android: 21
  
  # iOS specific
  ios_content_json: true
  
  # Remove default Flutter icons
  remove_alpha_ios: true
  
  # Adaptive icon for Android (yellow background + transparent foreground)
  adaptive_icon_background: "#FDC500"
  adaptive_icon_foreground: "assets/images/wizbusiness_wordmark_fg_1024.png"
